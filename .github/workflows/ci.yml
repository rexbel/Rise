name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck + tests (rules oracle on all 7 seed patients)
        run: npm run check
      - name: Lint
        run: npm run lint
      # next/font/google downloads every font file at build time, and fonts.gstatic.com sometimes fails one
      # from GitHub runners ("Can't resolve '@vercel/turbopack-next/internal/font/google/font'"). Retry before
      # calling it a real failure; a code error fails all three attempts the same way.
      - name: Production build
        run: |
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "::warning::Build attempt $attempt failed; retrying in 20 s (Google Fonts download)"
            sleep 20
          done
          exit 1
